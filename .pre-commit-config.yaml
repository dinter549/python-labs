repos:
  - repo: local
    hooks:
      - id: mypy-lab-01
        name: mypy (lab_01)
        entry: python -m mypy
        language: system
        args:
          - --show-error-codes
          - --pretty
          - lab_01/src
          - lab_01/tests
        files: ^lab_01/.*\.py$
        pass_filenames: false
        require_serial: true

      - id: ruff-lab-01
        name: Ruff (lab_01)
        entry: python -m ruff check
        language: system
        files: ^lab_01/.*\.py$
        types: [python]

  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-yaml
      - id: check-toml
      - id: check-json
      - id: end-of-file-fixer
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: check-added-large-files
